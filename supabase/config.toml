# Configuration Supabase CLI (projet POS cloud).
# Les Edge Functions s'authentifient par clé de site (cle_site), PAS par JWT
# Supabase : on désactive verify_jwt pour qu'elles soient appelables par le
# serveur local sans jeton Supabase.

project_id = "pos-samer-cloud"

[functions.sync-push]
verify_jwt = false

[functions.sync-pull]
verify_jwt = false

[functions.sync-reconcile]
verify_jwt = false

[functions.admin-catalogue]
verify_jwt = false

# File d'ordres du siège, relevée par chaque site avec sa clé de site. Absente
# d'ici jusqu'au 2026-10-26 : déployée avec le défaut (jeton exigé), elle
# répondait 401 à tous les postes avant même d'atteindre le code.
[functions.ordres]
verify_jwt = false

# Console siège : elle s'authentifie bien par JWT Supabase, mais la
# vérification est faite DANS la fonction (`verifierSiege`), et elle va plus
# loin que la passerelle — celle-ci accepterait la clé anonyme, qui est
# publique. La désactiver ici évite en prime que la requête préalable CORS
# (OPTIONS, sans en-tête Authorization) soit rejetée avant d'atteindre le code.
[functions.siege]
verify_jwt = false

# Pont vers SamerTrackly : appelé UNIQUEMENT par pg_cron, qui présente la clé
# service_role. Contrairement à toutes les autres, cette fonction garde donc la
# vérification de jeton activée — elle écrit dans la base RH du groupe et ne doit
# être appelable ni par un site, ni par un navigateur. La ligne est explicite
# pour qu'on voie que ce n'est pas un oubli.
[functions.samtrackly-points]
verify_jwt = true

# Mise à jour à distance des postes (contrat docs/MAJ_CONTRAT.md § 2) :
# authentifiée par clé de site, comme sync-pull et ordres.
[functions.maj]
verify_jwt = false
